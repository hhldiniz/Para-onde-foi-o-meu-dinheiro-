<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
    <!--
      Scalable app icon, the same artwork as the Android adaptive icon
      (app/src/androidMain/res/drawable/ic_launcher_foreground.xml on the yellow
      ic_launcher_background): a banknote losing a coin, tilted for the app's
      neo-brutalist tone.

      The group is zoomed 1.4x about the centre because, unlike an adaptive
      icon, this one is never masked — the 66dp safe zone would just read as
      empty yellow margin. The maskable PNGs (icon-maskable-*.png) are rendered
      from these same shapes at zoom 1, keeping the safe-zone framing that a
      circle/squircle mask needs.
    -->
    <rect width="108" height="108" fill="#EAB308"/>
    <g transform="translate(54 54) scale(1.4) translate(-54 -54) rotate(-8 54 54)">
        <!-- hard shadow, offset the same way HardShadowBox draws its shadow -->
        <rect x="33" y="43" width="52" height="34" fill="#000000"/>
        <!-- banknote -->
        <rect x="28" y="38" width="52" height="34" fill="#FFF5E6" stroke="#000000" stroke-width="5"/>
        <!-- coin -->
        <circle cx="54" cy="55" r="12" fill="#FF0080" stroke="#000000" stroke-width="4"/>
        <!-- coin detail ring -->
        <circle cx="54" cy="55" r="6" fill="none" stroke="#000000" stroke-width="2.5"/>
    </g>
</svg>
