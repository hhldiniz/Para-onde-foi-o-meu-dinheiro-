<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Pra onde foi o meu dinheiro</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!--
      Defines window.praOndeExtractPdfText, used by PdfParser.wasmJs.kt.
      A module script so it can `import()` pdf.js lazily; this file itself
      is tiny (no pdf.js code), so loading it eagerly costs nothing, and the
      ~1MB pdf.js library is only fetched the first time a user actually
      picks a PDF.
    -->
    <script type="module" src="pdf-extract.js"></script>
    <script src="praondefoiomeudinheiro.js"></script>
</body>
</html>
