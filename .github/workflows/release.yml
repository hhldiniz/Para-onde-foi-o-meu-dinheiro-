name: Release Build

# Builds the signed release APK. It runs on pull requests too, so a change that
# breaks release signing or the release variant fails next to the tests rather
# than months later when someone cuts a tag.
on:
  pull_request:
    branches: [ master, main ]
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      # Only used by the last step, and only for a tag: attaching the APK to
      # that tag's GitHub release.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Two ways to get a key, in this order:
      #
      # 1. RELEASE_KEYSTORE_BASE64 and friends, from the repository secrets.
      #    That key is stable across builds, so an APK it signs installs over
      #    the previous one — the only option if the builds are handed to
      #    anyone.
      # 2. A self-signed key generated here, with a password that exists for
      #    the length of this job. Nothing to set up, and enough to produce an
      #    installable APK, but every build is signed by a different
      #    certificate: Android refuses to update an install across that, so
      #    testers have to uninstall first.
      #
      # To switch to (1): run scripts/generate-release-keystore.sh once, then
      #   base64 -w0 release.jks
      # and store the output as RELEASE_KEYSTORE_BASE64, alongside
      # RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS (plus
      # RELEASE_KEY_PASSWORD if the keystore has a separate one).
      - name: Resolve the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but RELEASE_KEYSTORE_PASSWORD or RELEASE_KEY_ALIAS is missing"
              exit 1
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
            {
              echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
              echo "SIGNING_KEY_SOURCE=repository secret"
            } >> "$GITHUB_ENV"
          else
            password=$(openssl rand -hex 32)
            # Masked before it is used anywhere, so it cannot reach the log
            # through a command echo or a keytool error.
            echo "::add-mask::$password"
            alias=praondefoiomeudinheiro
            RELEASE_KEYSTORE_PASSWORD="$password" RELEASE_KEY_ALIAS="$alias" \
              ./scripts/generate-release-keystore.sh "$keystore"
            {
              echo "RELEASE_KEYSTORE_PASSWORD=$password"
              echo "RELEASE_KEY_ALIAS=$alias"
              echo "SIGNING_KEY_SOURCE=generated for this build"
            } >> "$GITHUB_ENV"
          fi

          echo "RELEASE_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # Proof that the APK really is signed, and by which certificate. An
      # unsigned build is otherwise a silent success: AGP just names the file
      # app-release-unsigned.apk and carries on.
      - name: Verify the signature
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)

          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          "$apksigner" verify --print-certs "$apk" | tee /tmp/signature.txt

          {
            echo "## Release APK"
            echo
            echo "- File: \`$(basename "$apk")\` ($(du -h "$apk" | cut -f1))"
            echo "- Signing key: **$SIGNING_KEY_SOURCE**"
            echo
            echo '```'
            grep -E "Signer #1 certificate (DN|SHA-256 digest)" /tmp/signature.txt || cat /tmp/signature.txt
            echo '```'
            if [ "$SIGNING_KEY_SOURCE" = "generated for this build" ]; then
              echo
              echo "> This certificate exists only for this run, so the APK cannot be installed"
              echo "> over one from another build. Set the \`RELEASE_KEYSTORE_*\` repository"
              echo "> secrets to sign every build with the same key."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes
          gh release upload "$tag" "$APK_PATH" --clobber
